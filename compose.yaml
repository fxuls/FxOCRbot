services:
  bot:
    build:
      context: .
      args:
        WITH_OCRIA_NANO: "${WITH_OCRIA_NANO:-0}"
    image: fxocrbot:local
    container_name: fxocrbot
    command: ["fxocr-bot"]
    env_file: .env
    restart: unless-stopped
    init: true
    # Hardening: the bot handles files from strangers.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    volumes:
      - fxocr-data:/data   # per-user engine choice (prefs.json) only
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g        # PP-OCRv6 peaks ~0.8 GB per job on large images
    memswap_limit: 2g
    cpus: 2
    pids_limit: 128
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fxocr-data:
