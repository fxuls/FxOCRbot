[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fxocr"
version = "0.1.0"
description = "FxOCRbot: OCR as a Telegram bot (website and API planned), built on LiteParse"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "liteparse==2.21.2",
    "pillow==13.0.0",
]

[project.optional-dependencies]
bot = ["python-telegram-bot==22.8"]
dev = ["pytest>=8"]

[project.scripts]
fxocr-bot = "fxocr.bot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
